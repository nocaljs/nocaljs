site_name: NocalJS Documentation
site_description: A lightweight, functional, and zero-calories reactive framework.
site_author: Johan Van den Brande
site_url: https://nocal.dev/docs/
repo_url: https://github.com/nocaljs/nocaljs
extra:
  homepage: ..

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/nocal_small.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core: nocaljs-core.md
  - CAD2D: nocaljs-cad2d.md
  - UI Components: nocaljs-ui.md
  - Configuration: nocaljs-config.md
  - Extensions: nocaljs-ext.md
  - About Docs: nocaljs-docs.md
  - Best Practices: nocaljs-howto.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
