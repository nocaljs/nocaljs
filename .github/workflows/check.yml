name: Contributor checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: packages/nocaljs-docs/requirements.txt
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: python3 -m pip install -r packages/nocaljs-docs/requirements.txt
      - run: npm run check
